[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "canary-health"
version = "0.1.0"
description = "Reference implementation of a dynamic, multi-metric canary-deployment health model and automated-rollback controller for Kubernetes progressive delivery."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Manvitha Potluri", email = "manvitha@24x7systems.com" }
]
keywords = [
    "kubernetes",
    "canary-deployment",
    "progressive-delivery",
    "automated-rollback",
    "sre",
    "devops",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/ManvithaP-hub/canary-health"
Repository = "https://github.com/ManvithaP-hub/canary-health"

[project.scripts]
canary-health = "canary_health.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["canary_health*"]
